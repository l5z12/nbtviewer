# ---------------------------------------------------------------------------
# Mod identity (shared across all Minecraft versions)
# ---------------------------------------------------------------------------
mod.id=nbtviewer
mod.version=0.1.0
mod.group=dev.l5z12.nbtviewer

# Fabric Loader is version-independent enough to share.
deps.fabric_loader=0.16.14

# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=false
org.gradle.caching=true
# Only configure the version node(s) actually being built. Without this, building a
# single node (e.g. :1.20-fabric:build) still configures — and applies Loom to — all
# 21 nodes. Verified safe for single-node builds and chiseledBuild.
org.gradle.configureondemand=true

# ---------------------------------------------------------------------------
# HTTP(S) proxy settings are intentionally NOT tracked here. If your network
# needs a proxy for dependency / Minecraft / mapping downloads, put it in your
# Gradle user home (~/.gradle/gradle.properties) or pass it via GRADLE_OPTS —
# see README.md. Keeping it out of the repo avoids forcing a localhost proxy on
# CI and other contributors.
# ---------------------------------------------------------------------------
