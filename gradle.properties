# ---------------------------------------------------------------------------
# Mod identity (shared across all Minecraft versions)
# ---------------------------------------------------------------------------
mod.id=nbtviewer
mod.version=1.0.0
mod.group=dev.l5z12.nbtviewer

# Fabric Loader is version-independent enough to share.
deps.fabric_loader=0.16.14

# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=false
org.gradle.caching=true

# ---------------------------------------------------------------------------
# Proxy for dependency / Minecraft / mapping downloads (requested: Clash @ 7890)
# The Gradle *wrapper* bootstrap uses GRADLE_OPTS instead (see README.md).
# ---------------------------------------------------------------------------
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
