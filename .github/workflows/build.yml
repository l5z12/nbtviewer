name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fast routine check: one node per //? if guard boundary (covers every branch in the
# codebase) rather than all 21. Run the full matrix from build-all.yml on demand.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.20.1",  java: "21" }   # pre-1.20.5: writeNbt, new Identifier
          - { mc: "1.20.5",  java: "21" }   # data components: ItemStack.CODEC, Identifier.of
          - { mc: "1.21.5",  java: "21" }   # getCompound -> Optional
          - { mc: "1.21.6",  java: "21" }   # Matrix3x2fStack, createNbtWithIdentifyingData, WriteView
          - { mc: "1.21.9",  java: "21" }   # KeyInput/Click, KeyBinding.Category, 6-arg scroll
          - { mc: "1.21.11", java: "21" }   # latest yarn
          - { mc: "26.1",    java: "25" }   # Mojmap
          - { mc: "26.2",    java: "25" }   # latest Mojmap
    uses: ./.github/workflows/_build.yml
    with:
      mc: ${{ matrix.mc }}
      java: ${{ matrix.java }}
